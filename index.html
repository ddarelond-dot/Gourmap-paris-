    <script>
      // Gracefully silence benign Vite HMR WebSocket connection closed warnings in preview environment
      window.addEventListener('error', function(event) {
        if (event && event.message && (event.message.includes('WebSocket') || event.message.includes('ws:'))) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(event) {
        if (event && event.reason && (event.reason.message && event.reason.message.includes('WebSocket'))) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
    </script>
